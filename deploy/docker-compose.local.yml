services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: web_cost_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: deploy/local.Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      LOCAL_API_PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/web_cost_app
      SESSION_SECRET: change-this-before-use
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "3001:3001"

volumes:
  postgres_data:
